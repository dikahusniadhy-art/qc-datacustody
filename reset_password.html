<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - KROM Bank Indonesia</title>
    <link rel="icon" href="foto/krom1.png">

    <link rel="stylesheet" href="css/reset_password.css?v=3.0.3">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>

    <main class="reset-page">

        <section class="reset-card">

            <header class="reset-header">

                <div class="reset-logo">
                    K
                </div>

                <h1>
                    Reset Password
                </h1>

                <p>
                    Perbarui password akun Custody Management System Anda.
                </p>

            </header>


            <form id="resetPasswordForm" class="reset-form">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input type="text" id="username" class="form-control" placeholder="Masukkan username"
                        autocomplete="username" required>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Terdaftar
                    </label>

                    <input type="email" id="email" class="form-control" placeholder="Masukkan email terdaftar"
                        autocomplete="email" required>

                </div>


                <div class="form-group">

                    <label for="newPassword">
                        Password Baru
                    </label>

                    <div class="password-wrapper">

                        <input type="password" id="newPassword" class="form-control"
                            placeholder="Masukkan password baru" autocomplete="new-password" required>

                        <button type="button" class="password-toggle" id="toggleNewPassword"
                            aria-label="Tampilkan password">
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                    <small class="password-hint">
                        Minimal 12 karakter, huruf besar, huruf kecil,
                        angka, dan karakter khusus.
                    </small>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Konfirmasi Password
                    </label>

                    <div class="password-wrapper">

                        <input type="password" id="confirmPassword" class="form-control"
                            placeholder="Ulangi password baru" autocomplete="new-password" required>

                        <button type="button" class="password-toggle" id="toggleConfirmPassword"
                            aria-label="Tampilkan password">
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>


                <div id="resetMessage" class="reset-message" hidden></div>

                <div class="form-group" id="otpGroup" hidden>
                    <label for="otp">
                        Kode OTP
                    </label>

                    <input type="text" id="otp" class="form-control" inputmode="numeric" maxlength="6"
                        autocomplete="one-time-code" placeholder="Masukkan 6 digit kode OTP">
                </div>

                <input type="hidden" id="requestId">


                <button type="submit" id="btnResetPassword" class="reset-button">
                    <i class="fa-solid fa-key"></i>
                    Reset Password
                </button>

            </form>


            <div class="back-login">

                <a href="login.html">
                    <i class="fa-solid fa-arrow-left"></i>
                    Kembali ke Login
                </a>

            </div>

        </section>

    </main>


    <script src="js/config.js?v=1.0.0"></script>
    <script src="js/api.js?v=1.0.0"></script>
    <script src="js/helper.js?v=1.0.0"></script>
    <script src="js/reset_password.js?v=1.0.0"></script>

</body>

</html>
